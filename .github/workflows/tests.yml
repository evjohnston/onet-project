name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor declared in pyproject; 3.13 is what it is developed on.
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install -q --upgrade pip
          pip install -q -r requirements.txt
          pip install -q anthropic pydantic      # the scoring stage's optional deps
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Every module imports
        # a stage that only fails at runtime is a stage nobody notices is broken
        run: |
          python - <<'PY'
          import importlib, pkgutil, onet_scraper
          for m in pkgutil.iter_modules(onet_scraper.__path__):
              importlib.import_module(f"onet_scraper.{m.name}")
              print("ok", m.name)
          PY
      - name: CLI responds
        run: python -m onet_scraper --help > /dev/null

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install -q --upgrade pip
          pip install -q -r requirements.txt
      - name: METHODOLOGY.md figures are in step with data/out
        # The document quotes several hundred figures and nothing verified any
        # of them. They rotted twice in one session - a test count that drifted
        # to 66 against a suite of 170, and every security-matrix cell after the
        # two scoring passes were consolidated. Both times it looked fine.
        run: python -m onet_scraper validate-doc
      - name: docs/ is in step with data/out
        # publish is a manual stage, so it is easy to ship a site that lags the
        # data it was built from. Compare the two copies rather than trusting it.
        run: |
          status=0
          for f in story.html dashboard.html security_matrix.html; do
            if [ ! -f "docs/$f" ]; then echo "::error::docs/$f missing"; status=1; continue; fi
            if ! cmp -s "data/out/$f" "docs/$f"; then
              echo "::error::docs/$f differs from data/out/$f - run: python -m onet_scraper publish"
              status=1
            fi
          done
          [ -f docs/CNAME ] || { echo "::error::docs/CNAME missing - custom domain will drop"; status=1; }
          exit $status

  pages:
    # The dashboard shipped reading window.DATA when the payload was declared
    # `const DATA`, so three columns rendered blank on a page that otherwise
    # looked fine. Nothing caught it because nothing loaded a page. This job
    # opens all five in headless Chrome and asserts they actually rendered.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install -q --upgrade pip
          pip install -q -r requirements.txt
      - name: Chrome
        uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: Pages render
        run: |
          mkdir -p data/out
          python -m onet_scraper smoke --chrome "${{ steps.chrome.outputs.chrome-path }}"
      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: data/out/smoke_report.json
